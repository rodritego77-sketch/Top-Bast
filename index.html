<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top-Bast</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}
header {
  background: #07111f;
  padding: 25px 15px;
  text-align: center;
  border-bottom: 3px solid #20c878;
}
h1 { margin: 0; color: #20c878; }
main { padding: 20px; }
.card {
  background: #1e293b;
  padding: 18px;
  margin: 15px 0;
  border-radius: 12px;
}
h2 { color: #20c878; }
footer {
  text-align: center;
  padding: 20px;
  color: #aab4c3;
}
</style>
</head>
<body>
<header>
  <h1>TOP-BAST</h1>
  <p>Sporti • Ndeshjet • Rezultatet</p>
</header>
<main>
  <div class="card">
    <h2>Mirë se vini në Top-Bast!</h2>
    <p>Platforma jote për lajme dhe rezultate sportive.</p>
  </div>
  <div class="card">
    <h2>⚽ Futboll</h2>
    <p>Ndeshjet dhe rezultatet do të shfaqen këtu.</p>
  </div>
  <div class="card">
    <h2>📊 Rezultatet</h2>
    <p>Informacionet sportive do të shtohen së shpejti.</p>
  </div>
</main>
<footer>© 2026 Top-Bast</footer>
</body>
</html>
